# Describes the services for ShieldDNS

block_domain:
  name: Block Domain
  description: Instantly adds a domain to the ShieldDNS blocklist.
  target:
    entity:
      integration: shielddns
  fields:
    domain:
      name: Domain
      description: The domain to block (e.g., tiktok.com).
      required: true
      example: "tiktok.com"
      selector:
        text:

allow_domain:
  name: Allow Domain
  description: Instantly adds a domain to the ShieldDNS allowlist (whitelist).
  target:
    entity:
      integration: shielddns
  fields:
    domain:
      name: Domain
      description: The domain to allow (e.g., netflix.com).
      required: true
      example: "netflix.com"
      selector:
        text:

remove_rule:
  name: Remove Domain Rule
  description: Removes a domain from both the blocklist and allowlist.
  target:
    entity:
      integration: shielddns
  fields:
    domain:
      name: Domain
      description: The domain to remove (e.g., tiktok.com).
      required: true
      example: "tiktok.com"
      selector:
        text:

set_client_alias:
  name: Set Client Alias
  description: Set a friendly name (alias) for a specific client IP address.
  target:
    entity:
      integration: shielddns
  fields:
    ip:
      name: Client IP
      description: The IP address of the client (e.g., 192.168.1.50).
      required: true
      example: "192.168.1.50"
      selector:
        text:
    alias:
      name: Alias
      description: The friendly name to assign (leave empty to remove).
      required: false
      example: "Work Laptop"
      selector:
        text:

block_client:
  name: Block/Unblock Client
  description: Toggles blocking for a specific client device by its IP.
  target:
    entity:
      integration: shielddns
  fields:
    ip:
      name: Client IP
      description: The IP address of the client to manage.
      required: true
      example: "192.168.1.50"
      selector:
        text:
    block:
      name: Block
      description: Set to ON to block, OFF to unblock.
      required: true
      default: true
      selector:
        boolean:

set_domain_mapping:
  name: Set Domain Mapping
  description: Set a custom DNS mapping (A/AAAA) for a domain.
  target:
    entity:
      integration: shielddns
  fields:
    domain:
      name: Domain
      description: The domain to map (e.g., local.home).
      required: true
      example: "local.home"
      selector:
        text:
    ip:
      name: IP Address
      description: The IP address to map the domain to (e.g., 192.168.1.10).
      required: true
      example: "192.168.1.10"
      selector:
        text:

set_routing_rule:
  name: Set DNS Routing Rule
  description: Configure selective DNS routing for a specific domain or client IP.
  target:
    entity:
      integration: shielddns
  fields:
    match:
      name: Match Pattern
      description: Domain name (e.g., internal.corp) or Client IP/CIDR (e.g., 192.168.1.50).
      required: true
      example: "internal.corp"
      selector:
        text:
    target:
      name: Routing Target
      description: Target upstream mode (default, host, wireguard).
      required: false
      default: "default"
      selector:
        select:
          options:
            - "default"
            - "host"
            - "wireguard"
    host_target:
      name: Specific Host Endpoint
      description: Destination upstream host (e.g., 10.0.0.1:53) when target is 'host'.
      required: false
      example: "10.0.0.1:53"
      selector:
        text:
    wireguard_config:
      name: WireGuard DNS Endpoint
      description: WireGuard tunnel DNS gateway when target is 'wireguard'.
      required: false
      example: "10.200.0.1:53"
      selector:
        text:
    name:
      name: Rule Name
      description: Optional friendly name for this routing rule.
      required: false
      example: "Work VPN Route"
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the routing rule is active.
      required: false
      default: true
      selector:
        boolean:

delete_routing_rule:
  name: Delete DNS Routing Rule
  description: Remove a policy-based DNS routing rule.
  target:
    entity:
      integration: shielddns
  fields:
    match:
      name: Match Pattern
      description: The domain or client IP of the rule to delete.
      required: true
      example: "internal.corp"
      selector:
        text:

