name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'custom_components/shielddns/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
